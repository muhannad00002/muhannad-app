<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oman Wedding Vendors — Dashboard</title>
  <meta name="description" content="Browse, filter and export wedding-vendor data collected across Oman." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Oman Wedding Vendors</h1>
        <p class="brand-sub" id="dataMeta">Loading data…</p>
      </div>
    </div>

    <div class="topbar-actions">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z"/></svg>
        <input id="search" type="search" placeholder="Search name, phone, address, website…" autocomplete="off" />
      </div>
      <button class="btn" id="uploadBtn" title="Load a vendors.json or .csv exported by the collector">Load data</button>
      <div class="menu">
        <button class="btn btn-primary" id="exportBtn">Download ▾</button>
        <div class="menu-list" id="exportMenu" hidden>
          <button data-export="csv-filtered">CSV — current view (Excel)</button>
          <button data-export="csv-selected">CSV — selected rows</button>
          <button data-export="csv-all">CSV — everything</button>
          <button data-export="json-filtered">JSON — current view</button>
          <button data-export="whatsapp">WhatsApp contact list (.csv)</button>
        </div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
    </div>
    <input id="fileInput" type="file" accept=".json,.csv" hidden />
  </header>

  <main class="layout">
    <!-- Filters -->
    <aside class="filters" id="filters">
      <div class="filters-head">
        <h2>Filters</h2>
        <button class="link-btn" id="resetFilters">Reset</button>
      </div>

      <label class="field">
        <span>Minimum rating</span>
        <div class="rating-row">
          <input type="range" id="minRating" min="0" max="5" step="0.5" value="0" />
          <output id="minRatingOut">Any</output>
        </div>
      </label>

      <div class="field">
        <span>Quick filters</span>
        <label class="check"><input type="checkbox" id="hasPhone" /> Has phone</label>
        <label class="check"><input type="checkbox" id="hasWebsite" /> Has website</label>
        <label class="check"><input type="checkbox" id="operationalOnly" /> Operational only</label>
      </div>

      <div class="field">
        <span>Governorate <em id="govCount"></em></span>
        <div class="chips" id="govFilter"></div>
      </div>

      <div class="field">
        <span>Category <em id="catCount"></em></span>
        <div class="chips scroll" id="catFilter"></div>
      </div>
    </aside>

    <!-- Content -->
    <section class="content">
      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <div class="result-count" id="resultCount">—</div>
        <div class="toolbar-right">
          <label class="inline">Sort
            <select id="sortSelect">
              <option value="business_name:asc">Name (A→Z)</option>
              <option value="rating:desc">Rating (high→low)</option>
              <option value="rating_count:desc">Reviews (most)</option>
              <option value="category:asc">Category</option>
              <option value="governorate:asc">Governorate</option>
            </select>
          </label>
          <label class="inline">Show
            <select id="pageSize">
              <option>25</option><option selected>50</option><option>100</option><option value="all">All</option>
            </select>
          </label>
        </div>
      </div>

      <div class="table-wrap">
        <table id="table">
          <thead>
            <tr>
              <th class="col-check"><input type="checkbox" id="selectAll" aria-label="Select all" /></th>
              <th data-sort="business_name">Business</th>
              <th data-sort="category">Category</th>
              <th data-sort="governorate">Governorate</th>
              <th data-sort="rating" class="num">Rating</th>
              <th>Contact</th>
              <th>Status</th>
              <th>Links</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="emptyState" hidden></div>
      </div>

      <div class="pager" id="pager" hidden>
        <button class="btn" id="prevPage">← Prev</button>
        <span id="pageInfo"></span>
        <button class="btn" id="nextPage">Next →</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
