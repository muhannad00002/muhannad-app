name: Vendor Collector CI

on:
  push:
    paths:
      - "vendor_collector/**"
  pull_request:
    paths:
      - "vendor_collector/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor_collector
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint (non-blocking)
        run: flake8 . --count --max-line-length=120 --statistics || true

      - name: Run tests
        run: pytest -q
