<script>
/* ============ ZAFFA — BRIDE SCREENS · B (vendors · detail · search · saved · profile) ============ */

/* the customer's home governorate (from their account), if signed in */
function myGovernorate(){ return (S.account && S.account.governorate) || (S.bride && S.bride.governorate) || ""; }

/* shared filter state for a category / search view */
function makeFilters(){return {gov:"",price:0,sort:"popular",offers:false};}
function vViews(v){ return typeof viewCount==="function"?viewCount(v):(v.popularity||0); }

function applyFilters(list,f,q){
  let r=list.slice();
  if(q){const s=q.toLowerCase();r=r.filter(v=>v.name.toLowerCase().includes(s)||(v.city||"").toLowerCase().includes(s)||(v.governorate||"").toLowerCase().includes(s)||(catById(v.catId)?.name.toLowerCase().includes(s))||v.short.toLowerCase().includes(s));}
  if(f.gov)r=r.filter(v=>(v.governorate||govOfCity(v.city))===f.gov);
  if(f.price)r=r.filter(v=>v.priceLevel===f.price);
  if(f.offers)r=r.filter(v=>v.offer);
  const sorters={
    popular:(a,b)=>vViews(b)-vViews(a),
    priceLow:(a,b)=>a.priceLevel-b.priceLevel,
    priceHigh:(a,b)=>b.priceLevel-a.priceLevel,
    newest:(a,b)=>(b.isNew-a.isNew)||(b.id>a.id?1:-1),
  };
  r.sort(sorters[f.sort]||sorters.popular);
  // when not filtering by a governorate, surface vendors in the customer's
  // own governorate first (local-first), without hiding the rest
  const mine=myGovernorate();
  if(mine && !f.gov){
    r.sort((a,b)=>((b.governorate===mine)-(a.governorate===mine)));
  }
  return r;
}

function filterBar(f,onChange){
  const activeCount=[f.gov,f.price,f.offers].filter(Boolean).length;
  const bar=h("div.scroll-x",{style:{display:"flex",gap:"8px",padding:"2px 20px 12px",margin:"0 -20px"}});
  bar.appendChild(h("button.chip"+(activeCount?".on":""),{onclick:()=>openFilterSheet(f,onChange)},
    [icon("sliders",15),"Filters",activeCount?h("span",{style:{background:"rgba(255,255,255,.3)",borderRadius:"9px",padding:"0 6px",fontSize:"11px"}},activeCount):null]));
  // one-tap "near me" using the customer's governorate
  const mine=myGovernorate();
  if(mine)bar.appendChild(h("button.chip"+(f.gov===mine?".on":""),{onclick:()=>{f.gov=f.gov===mine?"":mine;onChange();}},["📍 ",mine]));
  const sortLabels={popular:"Most viewed",priceLow:"Price ↑",priceHigh:"Price ↓",newest:"Newest"};
  bar.appendChild(h("button.chip",{onclick:()=>{
    let ref; ref=sheet({title:"Sort by",body:(close)=>h("div.col.gap8",Object.entries(sortLabels).map(([k,l])=>
      h("button.lrow",{style:{cursor:"pointer",width:"100%"},onclick:()=>{f.sort=k;close();onChange();}},[
        h("span.grow",{style:{fontWeight:f.sort===k?"700":"500",color:f.sort===k?"var(--rose-deep)":""}},l),
        f.sort===k?icon("check",18,"faint"):null])))});
  }},[icon("filter",15),sortLabels[f.sort]]));
  bar.appendChild(h("button.chip"+(f.offers?".on":""),{onclick:()=>{f.offers=!f.offers;onChange();}},"🎁 Offers"));
  // governorate chips (customer's first)
  const govs=mine?[mine,...GOVERNORATES.filter(g=>g!==mine)]:GOVERNORATES;
  govs.forEach(g=>bar.appendChild(h("button.chip"+(f.gov===g?".on":""),{onclick:()=>{f.gov=f.gov===g?"":g;onChange();}},g)));
  return bar;
}

function openFilterSheet(f,onChange){
  let ref;
  const mine=myGovernorate();
  const govs=mine?[mine,...GOVERNORATES.filter(g=>g!==mine)]:GOVERNORATES;
  ref=sheet({title:"Filters",body:(close)=>{
    const b=h("div.col.gap16",{style:{marginTop:"6px"}});
    // governorate
    b.appendChild(fGroup("Governorate",["",...govs].map(c=>chip(c||"All Oman",f.gov===c,()=>{f.gov=c;refreshMarks();}))));
    // price
    b.appendChild(fGroup("Price",[0,1,2,3,4].map(p=>chip(p?priceLabel(p):"Any",f.price===p,()=>{f.price=p;refreshMarks();}))));
    // offers
    b.appendChild(fGroup("Only show",[chip("🎁 Special offers",f.offers,()=>{f.offers=!f.offers;refreshMarks();})]));
    function refreshMarks(){ref.close();setTimeout(()=>openFilterSheet(f,onChange),10);} // simple re-render
    return b;
  },actions:[
    h("button.btn.btn-sec.grow",{onclick:()=>{Object.assign(f,makeFilters());ref.close();onChange();}},"Reset"),
    h("button.btn.btn-pri.grow",{onclick:()=>{ref.close();onChange();}},"Show results"),
  ]});
  function fGroup(label,chips){return h("div",[h("div.lbl",label),h("div.row.wrap.gap8",chips)]);}
  function chip(label,on,fn){return h("button.chip"+(on?".on":""),{onclick:fn},label);}
}

/* ---------- CATEGORY / VENDOR LIST ---------- */
route("/category/:id",(q,p)=>{
  const cat=catById(p.id);
  if(!cat)return appFrame([topbar("Not found",{back:true}),h("div.empty",[h("div.em","🔍"),h("h3","Category not found")])],{tabs:brideTabs("/categories")});
  // freemium gate: first 3 distinct categories free
  if(!categoryViewable(p.id)){
    setTimeout(()=>openPaywall("category"),80);
    return appFrame([topbar(cat.name,{back:true}),
      h("div.empty",{style:{paddingTop:"56px"}},[
        h("div.em",{style:{fontSize:"52px"}},"🔒"),
        h("h3","Premium category"),
        h("p.muted",{style:{maxWidth:"280px",margin:"0 auto 20px"}},`You've viewed your ${FREE_CATEGORY_VIEWS} free categories. Go Premium to browse ${cat.name} and every other category — from under $2 a month.`),
        h("button.btn.btn-pri.btn-lg",{onclick:()=>openPaywall("category")},["Unlock all categories ",icon("fwd",16)]),
        h("button.btn.btn-quiet",{style:{marginTop:"10px"},onclick:()=>back()},"Go back"),
      ])],{tabs:brideTabs("/categories")});
  }
  recordCategoryView(p.id);
  const f=makeFilters();
  const kids=[topbar(cat.name,{back:true,right:h("button.icon-btn",{onclick:()=>go("/search?cat="+cat.id)},icon("search",21))})];
  const header=h("div.row.gap12",{style:{padding:"2px 3px 14px"}},[
    h("span.em",{class:"em",style:{width:"52px",height:"52px",borderRadius:"var(--r-full)",display:"grid",placeItems:"center",fontSize:"26px",background:"var(--rose-soft)"}},cat.icon),
    h("div",[h("div.small.muted","Curated vendors"),h("h3",{style:{fontSize:"20px"}},cat.name)]),
  ]);
  kids.push(header);
  let bar=filterBar(f,()=>redraw()); kids.push(bar);
  const listWrap=h("div.col.gap16",{style:{marginTop:"2px"}});
  kids.push(listWrap);
  const app=appFrame(kids,{tabs:brideTabs("/categories")});
  function redraw(){
    // rebuild filter bar (chips reflect state) and list
    const nb=filterBar(f,()=>redraw()); bar.replaceWith(nb); bar=nb;
    clear(listWrap);
    const res=applyFilters(vendorsInCat(cat.id),f);
    listWrap.appendChild(h("div.small.faint",{style:{margin:"0 3px 4px"}},res.length+(res.length===1?" vendor":" vendors")));
    if(!res.length)listWrap.appendChild(h("div.empty",[h("div.em","🌿"),h("h3","No matches"),h("p.muted","Try adjusting your filters."),
      h("button.btn.btn-ghost",{style:{marginTop:"14px"},onclick:()=>{Object.assign(f,makeFilters());redraw();}},"Clear filters")]));
    else res.forEach(v=>listWrap.appendChild(vendorCard(v)));
  }
  redraw();
  return app;
});

/* ---------- VENDOR DETAIL ---------- */
route("/vendor/:id",(q,p)=>{
  const v=vendorById(p.id);
  if(!v)return appFrame([topbar("Not found",{back:true}),h("div.empty",[h("div.em","🔍"),h("h3","Vendor not found")])],{noTab:true});
  const cat=catById(v.catId);
  const fav=S.favorites.includes(v.id);
  // find which checklist task this vendor could complete
  const linkedTask=planTasks().find(t=>t.catId===v.catId);
  const isSelected=linkedTask&&S.selectedVendor[linkedTask.id]===v.id;

  const kids=[];
  // cover with floating back / actions
  const cover=coverEl(v,"",1,true); cover.style.height="270px"; cover.style.width="100%"; cover.style.borderRadius="0 0 var(--r-xl) var(--r-xl)";
  cover.appendChild(h("div",{style:{position:"absolute",inset:"0",pointerEvents:"none",background:"linear-gradient(to bottom,rgba(0,0,0,.18),transparent 40%,transparent 70%,rgba(0,0,0,.15))"}}));
  const backBtn=h("button.icon-btn",{style:{position:"absolute",top:"calc(14px + env(safe-area-inset-top))",left:"16px",background:"rgba(255,255,255,.85)",backdropFilter:"blur(6px)"},onclick:()=>back()},icon("back",22));
  const favBtn=h("button.icon-btn",{style:{position:"absolute",top:"calc(14px + env(safe-area-inset-top))",right:"64px",background:"rgba(255,255,255,.85)",backdropFilter:"blur(6px)",color:fav?"var(--rose)":"var(--ink2)"},
    onclick:()=>{toggleFav(v.id);const on=S.favorites.includes(v.id);clear(favBtn).appendChild(icon(on?"heartFill":"heart",21));favBtn.style.color=on?"var(--rose)":"var(--ink2)";}},icon(fav?"heartFill":"heart",21));
  const shareBtn=h("button.icon-btn",{style:{position:"absolute",top:"calc(14px + env(safe-area-inset-top))",right:"16px",background:"rgba(255,255,255,.85)",backdropFilter:"blur(6px)"},
    onclick:()=>{const url=location.href; if(navigator.share)navigator.share({title:v.name,url}).catch(()=>{}); else{navigator.clipboard?.writeText(url);toast("Link copied","🔗");}}},icon("share",20));
  cover.append(backBtn,favBtn,shareBtn);
  if(v.featured)cover.appendChild(h("span.tag.tag-gold",{style:{position:"absolute",left:"16px",bottom:"16px"}},"★ Featured vendor"));

  // wrap cover so it can bleed to edges
  const coverWrap=h("div",{style:{margin:"0 -20px"}},cover);
  kids.push(coverWrap);

  // title block
  kids.push(h("div",{style:{padding:"16px 2px 4px"}},[
    h("div.between",[
      h("div",[h("h1",{style:{fontSize:"27px"}},v.name),
        h("div.row.gap6",{style:{marginTop:"5px",color:"var(--ink2)"}},[icon("pin",14),
          h("span.small",v.city+((v.governorate&&v.governorate!==v.city)?(" · "+v.governorate):"")),
          h("span.faint","·"),h("span.small",cat?cat.name:"")])]),
    ]),
    h("div.row.gap12",{style:{marginTop:"12px",flexWrap:"wrap"}},[
      h("span.row.gap6",{style:{color:"var(--ink2)"}},[icon("eye",15),h("b.small",(typeof viewCount==="function"?viewCount(v):0).toLocaleString("en")),h("span.small.faint","views")]),
      v.priceLevel?h("span.tag "+(v.priceLevel>=3?"tag-gold":"tag-rose"),priceLabel(v.priceLevel)):null,
      v.featured?h("span.tag.tag-gold","★ Featured"):null,
    ]),
  ]));
  // count this view (deduped per user), then refresh the number shown
  if(typeof recordVendorView==="function")recordVendorView(v.id);

  // offer banner
  if(v.offer)kids.push(h("div.card.pad-s",{style:{background:"linear-gradient(135deg,var(--gold-soft),var(--rose-soft))",display:"flex",gap:"10px",alignItems:"center",marginTop:"8px"}},
    [h("span",{style:{fontSize:"24px"}},"🎁"),h("div",[h("b.small","Special offer"),h("div.small.muted",v.offer.label)])]));

  // quick actions — guard missing fields, and use robust link opening
  const waNum=String(v.whatsapp||"").replace(/[^0-9]/g,"");
  const telNum=String(v.phone||"").replace(/[^0-9+]/g,"");
  const igHandle=String(v.instagram||"").replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/^@/,"").replace(/\/$/,"").trim();
  const mapQ=String(v.maps||v.city||v.governorate||"").trim();
  kids.push(h("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"9px",margin:"16px 0 4px"}},[
    actionBtn("chat","WhatsApp", waNum&&("https://wa.me/"+waNum), ()=>toast("No WhatsApp number for this vendor","💬")),
    actionBtn("phone","Call", telNum&&("tel:"+telNum), ()=>toast("No phone number for this vendor","📞")),
    actionBtn("ig","Instagram", igHandle&&(/^https?:/i.test(v.instagram||"")?v.instagram:"https://instagram.com/"+igHandle), ()=>toast("No Instagram for this vendor","📷")),
    actionBtn("pin","Map", mapQ&&(/^https?:/i.test(mapQ)?mapQ:"https://maps.google.com/?q="+encodeURIComponent(mapQ)), ()=>toast("No location for this vendor","📍")),
  ]));

  // gallery (only if the vendor has photos beyond the logo)
  if(vendorImages(v).length>1){
    kids.push(sectionTitle("Gallery"));
    kids.push(h("div.scroll-x",{style:{display:"flex",gap:"10px",margin:"0 -20px",padding:"2px 20px 4px"}},
      vendorImages(v).map((_,i)=>{const g=coverEl(v,"",i,false);g.style.width="150px";g.style.height="190px";g.style.flex="none";g.style.scrollSnapAlign="start";return g;})));
  }

  // about
  if(v.desc||v.short){
    kids.push(sectionTitle("About"));
    kids.push(h("p.muted",{style:{lineHeight:"1.6"}},v.desc||v.short));
  }

  // services
  if(Array.isArray(v.services)&&v.services.length){
    kids.push(sectionTitle("Services"));
    kids.push(h("div.row.wrap.gap8",v.services.map(s=>h("span.chip",[icon("check",14),s]))));
  }

  // working hours
  if(v.hours){
    kids.push(sectionTitle("Working hours"));
    kids.push(h("div.card.pad-s.row.gap12",[icon("clock",20,"faint"),h("span",v.hours)]));
  }

  // spacer for sticky bar
  kids.push(h("div",{style:{height:"92px"}}));

  const app=appFrame(kids,{noTab:true});
  app.querySelector(".screen").style.padding="0 20px 20px";

  // sticky select bar
  if(linkedTask){
    const booking=S.bookings[linkedTask.id];
    const selBtn=h("button.btn.btn-block "+(isSelected?"btn-sec":"btn-pri btn-lg"),{onclick:()=>{
      if(S.selectedVendor[linkedTask.id]===v.id){
        delete S.selectedVendor[linkedTask.id]; delete S.bookings[linkedTask.id]; setTask(linkedTask.id,"prog"); save();
        toast("Selection removed"); go("/vendor/"+v.id);
      }else{
        openBookingSheet(v,linkedTask.id,()=>go("/vendor/"+v.id));
      }
    }},isSelected?[icon("check",18),booking&&booking.date?("Booked "+new Date(booking.date+"T00:00:00").toLocaleDateString("en",{day:"numeric",month:"short"})+" — tap to undo"):"Selected — tap to undo"]:[icon("cal",18),"Select & pick a date"]);
    const bar=h("div",{style:{position:"fixed",bottom:"var(--kb, 0px)",left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:"460px",zIndex:"48",
      padding:"12px 20px calc(14px + env(safe-area-inset-bottom))",background:"color-mix(in srgb,var(--surface) 90%,transparent)",
      backdropFilter:"blur(14px)",borderTop:"1px solid var(--line)"}},selBtn);
    app.appendChild(bar);
  }
  return app;

  /* Contact action. When a real destination exists we render a genuine <a> so
     the user's tap opens tel:/wa.me/instagram/maps natively — mobile browsers
     (esp. iOS Safari) block a *programmatic* new-tab click, but always honour a
     direct tap on a real link. Missing fields fall back to a button + toast. */
  function actionBtn(ic,label,href,onMiss){
    const style={display:"flex",flexDirection:"column",alignItems:"center",gap:"6px",textDecoration:"none",color:"inherit",cursor:"pointer"};
    const inner=[h("span.icon-btn",{style:{width:"48px",height:"48px",color:"var(--rose-deep)",background:"var(--rose-soft)",border:"0"}},icon(ic,21)),
     h("span.tiny.muted",{style:{fontWeight:"600"}},label)];
    if(href){
      const ext=/^https?:/i.test(href);
      const attrs={href,style};
      if(ext){attrs.target="_blank";attrs.rel="noopener noreferrer";}
      return h("a",attrs,inner);
    }
    return h("button",{style,onclick:onMiss},inner);
  }
});
function sectionTitle(t){return h("h3",{style:{fontSize:"20px",margin:"26px 0 12px"}},t);}
function shortTask(t){return t.replace(/^(Book|Buy|Order|Choose|Arrange|Send|Set up|Reserve|Select|Consider|Prepare|Confirm|Draft|Print|Add|Plan|Hire) /,"");}
/* Robust external-link opener. window.open("_blank") is unreliable for
   tel:/wa.me/maps inside mobile webviews (silently blocked), so synthesize a
   real anchor click — which every browser and the Capacitor webview honor. */
function openLink(url){
  if(!url)return;
  try{
    const a=document.createElement("a");
    a.href=url;
    if(/^https?:/i.test(url)){a.target="_blank";a.rel="noopener noreferrer";}
    a.style.display="none";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>a.remove(),0);
  }catch(e){ try{location.href=url;}catch(_){} }
}

/* ---------- GLOBAL SEARCH ---------- */
route("/search",(q)=>{
  const f=makeFilters();
  if(q.cat){/* preset category filter via query when arriving from a category */}
  let query="";
  const kids=[];
  // Typing used to rebuild the filter bar and every result card on each
  // keystroke — the list visibly churned under the finger on a long query.
  // Coalesce keystrokes into one redraw, and leave the filter bar alone: it
  // doesn't depend on the query, so rebuilding it only cost a repaint.
  let _t=null;
  const input=h("input.field",{placeholder:"Search vendors, categories, cities…",style:{paddingLeft:"44px"},
    oninput:e=>{query=e.target.value;clearTimeout(_t);_t=setTimeout(()=>drawResults(),110);}});
  const inputWrap=h("div",{style:{position:"relative"}},[
    h("span",{style:{position:"absolute",left:"15px",top:"50%",transform:"translateY(-50%)",color:"var(--ink3)"}},icon("search",19)),
    input,
  ]);
  kids.push(h("div.row.gap8",{style:{padding:"14px 0 12px"}},[
    h("button.icon-btn",{onclick:()=>back()},icon("back",22)),
    h("div.grow",inputWrap),
  ]));
  let bar=filterBar(f,()=>redraw()); kids.push(bar);
  const results=h("div",{style:{marginTop:"4px"}});
  kids.push(results);
  const app=appFrame(kids,{tabs:brideTabs("/categories")});
  setTimeout(()=>input.focus(),150);

  function redraw(){
    const nb=filterBar(f,()=>redraw()); bar.replaceWith(nb); bar=nb;
    drawResults();
  }
  function drawResults(){
    clear(results);
    if(!query.trim() && !f.city && !f.price && !f.offers){
      // suggestions state: popular categories + trending vendors
      results.appendChild(h("div.eyebrow",{style:{margin:"6px 3px 12px"}},"Popular categories"));
      const grid=h("div.row.wrap.gap8");
      CATEGORIES.slice(0,10).forEach(c=>grid.appendChild(h("button.chip",{onclick:()=>go("/category/"+c.id)},[c.icon+" "+c.name])));
      results.appendChild(grid);
      results.appendChild(h("div.eyebrow",{style:{margin:"22px 3px 12px"}},"Trending vendors"));
      results.appendChild(h("div.col.gap16",VENDORS.slice().sort((a,b)=>b.popularity-a.popularity).slice(0,4).map(v=>vendorCard(v))));
      return;
    }
    const res=applyFilters(VENDORS.filter(v=>v.approved),f,query);
    results.appendChild(h("div.small.faint",{style:{margin:"4px 3px 10px"}},res.length+" result"+(res.length===1?"":"s")+(query?` for “${query}”`:"")));
    if(!res.length)results.appendChild(h("div.empty",[h("div.em","🔎"),h("h3","No results"),h("p.muted","Try a different search or clear filters.")]));
    else results.appendChild(h("div.col.gap16",res.map(v=>vendorCard(v))));
  }
  redraw();
  return app;
});

route("/notifications",()=>{

function generateSmartReminders(){
  const d=daysLeft();
  const critical=["makeup","photo","hall","catering","dress","cake","henna"];
  const already=new Set(S.notifs.map(n=>n.taskId));
  critical.forEach(id=>{

      const dtxt=d!=null?`Your wedding is in ${d} days. `:"";
      pushNotif({em:catById(t.catId)?.icon||"🔔",title:`Still to book: ${shortTask(t.title)}`,
        body:`${dtxt}Brides usually secure this early — tap to browse ${catById(t.catId)?.name.toLowerCase()||"vendors"}.`,taskId:id});
    }
  });
}

function openPaywall(reason){

function suggestBookingDate(){
  // a sensible default: ~2 weeks from today, but before the wedding
  const now=new Date(); now.setDate(now.getDate()+14);
  if(S.bride.date){ const w=new Date(S.bride.date+"T00:00:00"); if(now>w) now.setTime(w.getTime()-7*86400000); }
  return now.toISOString().slice(0,10);
}

  const existing=S.bookings[taskId];
  const d={date:existing?.date||suggestBookingDate(),time:existing?.time||"11:00",note:existing?.note||"",price:existing?.price!=null?existing.price:""};
  const task=templateById(taskId);

      h("div",[h("label.lbl","Agreed price (OMR) — optional"),priceI]),

/* ---------------- AI ASSISTANT (Aya) ---------------- */

function vpop(v){ return v.popularity!=null?v.popularity:(typeof viewCount==="function"?viewCount(v):0); }
function bestVendor(catId){ return vendorsInCat(catId).sort((a,b)=>vpop(b)-vpop(a))[0]; }
function budgetBreakdown(){
  const t=S.bride.budget||6000;
  const rows=[["Venue & hall",.34],["Catering & cake",.18],["Photography & video",.12],["Attire & beauty",.12],
    ["Décor & flowers",.10],["Entertainment",.06],["Buffer",.08]];
  return rows.map(([k,p])=>[k,Math.round(t*p)]);
}

function assistantAnswer(raw){
  const t=raw.toLowerCase().trim();
  const name=S.bride.name||"there";
  const d=daysLeft(), pct=progressPct(), c=counts();
  const has=re=>re.test(t);
  const chip=(label,q,route)=>({label,q,route});

  // greeting
  if(has(/^(hi|hello|hey|salam|salaam|marhaba|hala)\b/)||t==="hi")
    return {text:`Hi ${name}! 🌸 I'm Aya, your wedding assistant. I can help you plan, budget, and pick the right vendors. What's on your mind?`,
      chips:[chip("What should I do next?","what should I do next"),chip("Help with my budget","help me with my budget"),chip("Give me a tip","give me a tip")]};

  // thanks
  if(has(/\b(thank|thanks|shukran|shokran)\b/))
    return {text:"Anytime, love 💗 I'm here whenever you need a hand. Want me to suggest your next step?",chips:[chip("Yes, what's next?","what should I do next")]};

  // capabilities
  if(has(/what can you|who are you|help me\??$|how.*work|what do you do/))
    return {text:"I can suggest your next tasks, split your budget, recommend top-rated vendors for any service, share planning tips, and keep an eye on your countdown. Just ask — for example “find me a makeup artist” or “how should I spend my budget?”",
      chips:[chip("Recommend a photographer","recommend a photographer"),chip("Plan my budget","plan my budget"),chip("What's next?","what should I do next")]};

  // budget
  if(has(/budget|afford|spend|how much|money|cost breakdown|split.*(money|budget)/)){
    const rows=budgetBreakdown();
    const lines=rows.map(([k,v])=>`• ${k}: ${money(v)}`).join("\n");
    return {text:`Here's a balanced way to split your ${money(S.bride.budget)} budget:\n\n${lines}\n\nKeep the 8% buffer for the lovely surprises along the way. Want to adjust your total?`,
      chips:[chip("Edit my budget",null,"/profile/edit"),chip("Where should I splurge?","where should I splurge")]};
  }
  if(has(/splurge|worth.*money|invest|priorit.*(spend|money)/))
    return {text:"Splurge where it lasts: photography & video (your forever memories) and the venue (it shapes everything). Save on favours, printing and transport — small guests-notice-less items. 💡",
      chips:[chip("Recommend a photographer","recommend a photographer"),chip("Find a hall","find me a wedding hall")]};

  // countdown / timeline
  if(has(/how (long|many days)|days? (left|to go|until)|countdown|time left|when.*wedding|running out/)){
    if(d==null)return {text:"You haven't set your wedding date yet — add it and I'll pace everything for you.",chips:[chip("Set my date",null,"/profile/edit")]};
    const pace=d>180?"Plenty of time — lock your venue and top vendors first, then relax.":d>90?"Good timing. Focus on the big bookings this month.":d>30?"Crunch time — prioritise anything still not started.":"Final stretch! Confirm every detail and delegate the day-of.";
    return {text:`Your wedding is in ${d} days 💍 (${Math.floor(d/7)} weeks). You're ${pct}% planned with ${c.todo} tasks to go. ${pace}`,
      chips:[chip("What should I do next?","what should I do next"),chip("Show my plan",null,"/checklist")]};
  }

  // progress / status
  if(has(/progress|how.*(going|doing)|status|percent|how far/))
    return {text:`You're ${pct}% planned — ${c.done} done, ${c.prog} in progress, ${c.todo} to go. ${pct>75?"Amazing work! 🌟":pct>40?"Great momentum — keep it up! 💗":"Early days — let's tackle the big ones first."}`,
      chips:[chip("What's next?","what should I do next"),chip("Open my checklist",null,"/checklist")]};

  // next steps
  if(has(/next|start|begin|prioriti|what.*(do|should).*(do|now|first)|to.?do|where.*start|overwhelm|stress|lost/)){
    const s=suggestedTasks(3);
    if(!s.length)return {text:"You've completed everything — congratulations! 🎉 Time to relax and enjoy your day.",chips:[chip("Open my plan",null,"/checklist")]};
    const lines=s.map(x=>`• ${x.title}`).join("\n");
    return {text:`Here's what I'd focus on next, ${name}:\n\n${lines}\n\nTackle them one at a time — I'll suggest the following steps as you go. 💪`,
      chips:s.filter(x=>x.catId&&catById(x.catId)).slice(0,2).map(x=>chip("Browse "+catById(x.catId).name,null,"/category/"+x.catId)).concat([chip("Open my plan",null,"/checklist")])};
  }

  // favourites
  if(has(/favou?rite|saved|my list/)){
    const n=S.favorites.length;
    return {text:n?`You've saved ${n} vendor${n>1?"s":""}. Shall I open your favourites?`:"You haven't saved any vendors yet — tap the heart on any vendor you love and they'll appear in Saved.",
      chips:[n?chip("Open favourites",null,"/favorites"):chip("Browse vendors",null,"/categories")]};
  }

  // date / calendar
  if(has(/\b(date|calendar|appointment|schedule|remind|book)\b/)){
    const ups=upcomingBookings();
    if(ups.length)return {text:`You have ${ups.length} appointment${ups.length>1?"s":""} booked. When you select a vendor I let you pick a date and add it straight to your calendar. Want to see your appointments?`,
      chips:[chip("My appointments",null,"/appointments"),chip("Browse vendors",null,"/categories")]};
    return {text:"When you select a vendor, I'll ask for a date & time and you can add it to Google or Apple Calendar in one tap — with a reminder the day before. Pick a service to start!",
      chips:[chip("Browse categories",null,"/categories")]};
  }

  // category-specific recommendation
  for(const [re,cat] of CAT_KEYWORDS){
    if(has(re)){
      const v=bestVendor(cat), cname=catById(cat)?.name||"vendors";
      if(!v)return {text:`I don't have any ${cname} yet, but the admin adds new vendors often. Try browsing the category.`,chips:[chip("Open "+cname,null,"/category/"+cat)]};
      const tip=CAT_TIP[cat]?("\n\n💡 "+CAT_TIP[cat]):"";
      const vv=(typeof viewCount==="function"?viewCount(v):0).toLocaleString("en");
      return {text:`For ${cname.toLowerCase()}, brides love ${v.name} in ${v.governorate||v.city} — ${vv} brides have viewed them${v.featured?" · ★ Featured":""}. ${v.short||""}${tip}`,
        chips:[chip("View "+v.name,null,"/vendor/"+v.id),chip("See all "+cname,null,"/category/"+cat)]};
    }
  }

  // general recommend / best
  if(has(/recommend|suggest|best|top rated|find.*vendor|who.*(good|best)/)){
    const feats=VENDORS.filter(v=>v.featured&&v.approved).sort((a,b)=>vpop(b)-vpop(a)).slice(0,3);
    const lines=feats.map(v=>`• ${v.name} — ${(catById(v.catId)||{}).name||"Vendor"}, ${(typeof viewCount==="function"?viewCount(v):0).toLocaleString("en")} views`).join("\n");
    return {text:`Some of our most-viewed vendors right now:\n\n${lines}\n\nTell me which service you need and I'll find the perfect match.`,
      chips:feats.slice(0,2).map(v=>chip("View "+v.name,null,"/vendor/"+v.id)).concat([chip("Browse all",null,"/categories")])};
  }

  // tips
  if(has(/tip|advice|idea|help.*plan|suggestion/)){
    const tip=TIPS[Math.floor(Math.random()*TIPS.length)];
    return {text:`${tip.em} ${tip.t}\n\n${tip.b}`,chips:[chip("Another tip","give me a tip"),chip("What's next?","what should I do next")]};
  }

  // fallback
  return {text:`I'm not sure I caught that, ${name}, but I'm great with vendors, budgets, timelines and next steps. Try one of these 👇`,
    chips:[chip("What should I do next?","what should I do next"),chip("Plan my budget","plan my budget"),chip("Find a makeup artist","find me a makeup artist"),chip("Give me a tip","give me a tip")]};
}
const CAT_TIP={
  dresses:"Book your first fitting 4–6 months out; alterations take time.",
  halls:"Visit in person and ask about the guest capacity and parking.",
  makeup:"Always do a trial and bring a photo of your dress neckline.",
  photo:"Ask to see a full wedding gallery, not just highlights.",
  catering:"Schedule a tasting before you commit to a menu.",
  henna:"Book your henna artist for the night before, not the wedding day.",
  cake:"Match the cake flavour to the season and your dessert table.",
  flowers:"Choose in-season blooms to stay on budget and fresh.",
  planner:"A planner pays for itself in saved time and stress. Hire early.",
};

/* ---------------- LIVE AI (Claude) BRIDGE ----------------
   Aya's answers come from the backend /api/assistant endpoint, which calls
   Claude with live web search + vision. We keep the rule-based assistantAnswer()
   above as an instant offline fallback whenever the backend isn't reachable. */

/* A compact snapshot of the bride's plan + the real marketplace, so Aya can
   recommend actual vendors and pace advice to her timeline. */
function assistantContext(){
  const vends=(typeof VENDORS!=="undefined"?VENDORS:[])
    .filter(v=>v&&v.approved!==false)
    .slice(0,60)
    .map(v=>({name:v.name,category:(catById(v.catId)||{}).name||"",
      city:v.governorate||v.city||"",featured:!!v.featured}));
  let next=[];
  try{ next=suggestedTasks(6).map(x=>x.title); }catch(e){}
  return {
    name:S.bride.name||null,
    governorate:S.bride.governorate||null,
    weddingDate:S.bride.date||null,
    daysLeft:(typeof daysLeft==="function"?daysLeft():null),
    budget:S.bride.budget!=null?S.bride.budget:null,
    progressPct:(typeof progressPct==="function"?progressPct():null),
    nextTasks:next,
    vendors:vends,
  };
}

/* Turn the stored chat log into Anthropic-shaped messages (user/assistant with
   text + optional image blocks). */
function assistantApiMessages(){
  return S.assistant.msgs.map(m=>{
    const content=[];
    if(m.img)content.push({type:"image",source:{type:"base64",media_type:m.imgType||"image/jpeg",data:m.img.replace(/^data:[^,]+,/,"")}});
    if(m.text)content.push({type:"text",text:m.text});
    if(!content.length)content.push({type:"text",text:"(no text)"});
    return {role:m.role==="user"?"user":"assistant",content};
  });
}

/* If Aya names a vendor that's in the app, offer a tap-through chip. */
function assistantVendorChips(text){
  const low=(text||"").toLowerCase(); const out=[]; const seen={};
  for(const v of (typeof VENDORS!=="undefined"?VENDORS:[])){
    if(!v.name||seen[v.id])continue;
    if(v.name.length>=3 && low.includes(v.name.toLowerCase())){
      out.push({label:"View "+v.name,route:"/vendor/"+v.id}); seen[v.id]=1;
      if(out.length>=2)break;
    }
  }
  return out;
}

/* ---------------- ASSISTANT SCREEN ---------------- */
route("/assistant",()=>{
  const app=h("div.app");
  const screen=h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column"}});
  app.appendChild(screen);
  // header
  screen.appendChild(h("div.topbar",{style:{gap:"12px"}},[
    h("button.icon-btn",{onclick:()=>back()},icon("back",22)),
    h("div.row.gap8.grow",[
      h("span.avatar",{style:{width:"38px",height:"38px",fontSize:"16px",background:"linear-gradient(135deg,var(--rose),var(--gold))"}},"A"),
      h("div",[h("h1",{style:{fontSize:"18px",fontWeight:"600"}},"Aya"),
        h("div.tiny",{style:{color:"var(--good)"}},[h("span",{"aria-hidden":"true"},"● "),"Online · web search + photos"])]),
    ]),
    isPremium()?h("span.tag.tag-gold","Premium"):h("span.tag.tag-todo",FREE_AI_MESSAGES-S.assistant.used+" free"),
  ]));
  // messages
  const feed=h("div",{role:"log","aria-live":"polite","aria-label":"Conversation with Aya",
    style:{flex:"1",overflowY:"auto",padding:"8px 18px 12px",display:"flex",flexDirection:"column",gap:"12px"}});
  screen.appendChild(feed);

  function bubble(role,text,chips,img){
    const isUser=role==="user";
    const wrap=h("div",{style:{display:"flex",justifyContent:isUser?"flex-end":"flex-start",animation:"fadeUp .3s var(--ease)"}});
    const col=h("div",{style:{maxWidth:"84%",display:"flex",flexDirection:"column",gap:"8px",alignItems:isUser?"flex-end":"flex-start"}});
    if(img)col.appendChild(h("img",{src:img,style:{maxWidth:"200px",maxHeight:"240px",borderRadius:"var(--r-l)",boxShadow:"var(--shadow-1)",objectFit:"cover"}}));
    if(text)col.appendChild(h("div",{style:{padding:"11px 15px",borderRadius:isUser?"var(--r-l) var(--r-l) 4px var(--r-l)":"var(--r-l) var(--r-l) var(--r-l) 4px",
      background:isUser?"linear-gradient(135deg,var(--rose),var(--rose-deep))":"var(--surface)",color:isUser?"var(--on-rose)":"var(--ink)",
      boxShadow:"var(--shadow-1)",whiteSpace:"pre-wrap",lineHeight:"1.5",fontSize:"14.5px",border:isUser?"0":"1px solid var(--line)"}},text));
    if(chips&&chips.length)col.appendChild(h("div.row.wrap.gap8",chips.map(cp=>
      h("button.chip",{style:{background:"var(--rose-soft)",color:"var(--rose-deep)"},onclick:()=>{
        if(cp.route){go(cp.route);return;}
        if(cp.q)send(cp.q);
      }},cp.label))));
    wrap.appendChild(col); return wrap;
  }
  function typing(){
    return h("div",{style:{display:"flex",justifyContent:"flex-start"}},
      h("div",{style:{padding:"13px 16px",borderRadius:"var(--r-l)",background:"var(--surface)",boxShadow:"var(--shadow-1)",border:"1px solid var(--line)"}},
        h("div.row.gap6",[dot(0),dot(.15),dot(.3)])));
    function dot(delay){return h("span",{style:{width:"7px",height:"7px",borderRadius:"50%",background:"var(--ink3)",
      animation:"blink 1.2s "+delay+"s infinite"}});}
  }

  // Rebuilding the whole transcript on every turn threw away and re-created every
  // bubble in the conversation — the history visibly re-animated, attached photos
  // were re-decoded, and the cost grew with the chat. renderFeed() is now only for
  // the first paint; each new message is appended on its own.
  function bubbleFor(m){ return bubble(m.role,m.text,m.role==="bot"?m.chips:null,m.img); }
  function scrollFeed(smooth){
    const go=()=>feed.scrollTo({top:feed.scrollHeight,behavior:smooth?"smooth":"auto"});
    go(); requestAnimationFrame(go);
  }
  function appendMsg(m){ feed.appendChild(bubbleFor(m)); scrollFeed(true); }
  function renderFeed(){
    clear(feed);
    if(!S.assistant.msgs.length){
      feed.appendChild(bubble("bot",`Hi ${S.bride.name||"there"}! 🌸 I'm Aya, your personal wedding assistant. Ask me anything — I can search the web for the latest ideas and prices, recommend vendors, plan your budget, or look at a photo you send and give you my honest take. 📸`,
        [{label:"What should I do next?",q:"what should I do next"},{label:"2026 wedding trends",q:"what are the top wedding trends for 2026?"},{label:"Plan my budget",q:"plan my budget"},{label:"Find a photographer",q:"find me a photographer"}]));
    }else{
      S.assistant.msgs.forEach(m=>feed.appendChild(bubbleFor(m)));
    }
    scrollFeed(false);
  }

  let pendingImg=null;   // {data, type} — a photo attached to the next message

  async function send(text){
    text=(text||"").trim();
    if(!text && !pendingImg)return;
    // gate free users
    if(!isPremium() && S.assistant.used>=FREE_AI_MESSAGES){ openPaywall("assistant"); return; }
    const img=pendingImg; pendingImg=null; drawAttachment();
    const mine=img?{role:"user",text,img:img.data,imgType:img.type}:{role:"user",text};
    S.assistant.msgs.push(mine);
    if(!isPremium())S.assistant.used++;
    save();
    // the greeting bubble is not a real message — clear it on the first send
    if(S.assistant.msgs.length===1)clear(feed);
    appendMsg(mine);
    const tip=typing(); feed.appendChild(tip); scrollFeed(true);

    let replied=false;
    try{
      if(apiBase()){
        const out=await api("/api/assistant",{method:"POST",
          body:{messages:assistantApiMessages(),context:assistantContext()}});
        if(out&&out.text){
          const chips=assistantVendorChips(out.text);
          S.assistant.msgs.push({role:"bot",text:out.text,chips:chips.length?chips:undefined});
          replied=true;
        }
      }
    }catch(e){ /* backend down / not configured → fall back to offline answers */ }

    if(!replied){
      const ans=assistantAnswer(text||"Tell me about my wedding plan");
      S.assistant.msgs.push({role:"bot",text:ans.text,chips:ans.chips});
    }
    tip.remove();
    save(); appendMsg(S.assistant.msgs[S.assistant.msgs.length-1]);
    const badge=app.querySelector(".topbar .tag");
    if(badge&&!isPremium())badge.textContent=(FREE_AI_MESSAGES-S.assistant.used)+" free";
  }

  renderFeed();

  // composer
  const input=h("input.field",{placeholder:"Message Aya…",style:{borderRadius:"var(--r-full)"},
    onkeydown:e=>{if(e.key==="Enter"){const v=input.value;input.value="";send(v);}}});
  const sendBtn=h("button.icon-btn",{style:{width:"46px",height:"46px",background:"linear-gradient(135deg,var(--rose),var(--rose-deep))",color:"var(--on-rose)",border:"0",flex:"none"},
    onclick:()=>{const v=input.value;input.value="";send(v);}},icon("send",20));

  // photo attach — lets the bride send a picture for Aya to analyse
  const fileI=h("input",{type:"file",accept:"image/*",style:{display:"none"},onchange:async e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value="";
    if(!f)return;
    const data=await compressImage(f,1024,0.82);
    if(!data){toast("Couldn't read that image","⚠️");return;}
    const m=/^data:([^;,]+)[;,]/.exec(data);
    pendingImg={data,type:(m&&/^image\//.test(m[1]))?m[1]:"image/jpeg"};
    drawAttachment(); input.focus();
  }});
  const attachBtn=h("button.icon-btn",{style:{width:"44px",height:"44px",flex:"none","aria-label":"Attach a photo"},
    onclick:()=>fileI.click()},icon("camera",20));

  // small preview strip shown above the input while a photo is attached
  const attachStrip=h("div",{style:{padding:"0 16px"}});
  function drawAttachment(){
    clear(attachStrip);
    if(!pendingImg){attachStrip.style.display="none";return;}
    attachStrip.style.display="block";
    attachStrip.appendChild(h("div.row.gap8",{style:{alignItems:"center",padding:"8px 0 2px"}},[
      h("img",{src:pendingImg.data,style:{width:"46px",height:"46px",borderRadius:"10px",objectFit:"cover",boxShadow:"var(--shadow-1)"}}),
      h("span.tiny.faint.grow","Photo attached — ask Aya about it"),
      h("button.icon-btn.plain",{"aria-label":"Remove photo",onclick:()=>{pendingImg=null;drawAttachment();}},icon("close",18)),
    ]));
  }
  drawAttachment();

  // sits above the keyboard while she's typing (see --kb in 03-ui.js)
  screen.appendChild(h("div",{style:{position:"sticky",bottom:"var(--kb, 0px)",paddingBottom:"env(safe-area-inset-bottom)",
    background:"color-mix(in srgb,var(--surface) 92%,transparent)",backdropFilter:"blur(14px)",borderTop:"1px solid var(--line)"}},[
    attachStrip,
    h("div",{style:{padding:"10px 16px",display:"flex",gap:"8px",alignItems:"center"}},[attachBtn,input,sendBtn,fileI]),
  ]));
  setTimeout(()=>input.focus(),200);
  return app;
});

<script>
/* ============ ZAFFA — CLIENT PAYMENT LAYER ============
   A thin, provider-agnostic checkout front-end. Secrets live only on the
   backend (see wedding/server/). This module chooses the right provider:
     • Apple In-App Purchase   — when running inside the native iOS app (StoreKit)
     • Bank Muscat SmartPay    — on the web, when a backend endpoint is configured
     • Demo                    — offline / hosted demo: simulates the unlock

   Configure once, here. Leaving `backendBase` empty keeps the app in demo mode
   so the standalone HTML and hosted preview still work end-to-end. */
const PAY_CONFIG = {
  // Absolute API base. Same-origin on web; REQUIRED for the native iOS/Android
  // (Capacitor) build, whose origin is capacitor://localhost — without this it
  // would fall back to demo mode. Points at the production backend.
  backendBase: "https://weddingandco.vercel.app",
  appleProducts: { monthly: "com.zaffa.premium.monthly", annual: "com.zaffa.premium.annual" },
  prices: { monthly: "OMR 0.99", annual: "OMR 9.99" },
};

/* Backend base:
   1) a runtime override in localStorage("zaffa.backend"), else
   2) PAY_CONFIG.backendBase (absolute URL for a separate API domain), else
   3) same-origin when the app is actually served over http(s) — the Vercel
      case where /api lives on this domain. file:// (offline demo) → no backend. */
function apiBase(){
  try{ const o=localStorage.getItem("zaffa.backend"); if(o!==null && o!=="") return o.replace(/\/$/,""); }catch{}
  if(PAY_CONFIG.backendBase) return PAY_CONFIG.backendBase.replace(/\/$/,"");
  if(location.protocol==="http:"||location.protocol==="https:") return location.origin;
  return "";
}
async function api(path,{method="GET",body:payload}={}){
  const headers={"Content-Type":"application/json"};
  if(S.account&&S.account.token)headers.Authorization="Bearer "+S.account.token;
  let r;
  try{ r=await fetch(apiBase()+path,{method,headers,body:payload?JSON.stringify(payload):undefined}); }
  catch(netErr){ const e=new Error("Network error — check your connection"); e.status=0; throw e; }
  const data=await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error((data.error||"Request failed")+" ("+r.status+")"); e.status=r.status; throw e; }
  return data;
}

/* ---- cloud sync: catalog down, entitlement down, admin catalog up ---- */
/* live vendor view counts (vendorId -> count), refreshed from the backend */
let VIEWS={};
function viewCount(v){
  const id=typeof v==="object"?v.id:v;
  if(VIEWS[id]!=null)return VIEWS[id];
  // demo fallback: a stable, believable number when there's no backend yet
  return 40 + (hashStr(String(id))%460);
}
async function refreshViews(){
  if(!apiBase())return;
  try{ const r=await api("/api/vendors/views"); if(r&&r.views)VIEWS=r.views; }catch(e){}
}
async function recordVendorView(id){
  try{ if(localStorage.getItem("zaffa.viewed."+id))return; }catch{}
  VIEWS[id]=(VIEWS[id]||viewCount(id))+1;                 // optimistic local bump
  try{ localStorage.setItem("zaffa.viewed."+id,"1"); }catch{}
  if(!apiBase())return;
  try{ const r=await api("/api/vendors/"+encodeURIComponent(id)+"/view",{method:"POST"}); if(r&&r.views!=null)VIEWS[id]=r.views; }catch(e){}
}

let _applyingRemote=false;
async function cloudInit(opts){
  if(!apiBase())return;
  opts=opts||{};
  let _seedBaseline=false;
  _applyingRemote=true;               // suppress auto-publish while applying server data
  try{
    refreshViews();
    const cat=await api("/api/catalog");
    // First-run: the cloud catalog is empty. If an admin is here, publish the
    // current catalog once so customers get a real baseline (and it can never
    // stay stuck at version 0). Actual publish is fired after _applyingRemote clears.
    _seedBaseline = !cat.version;
    let changed=false;
    if(Array.isArray(cat.categories)&&cat.categories.length){CATEGORIES.length=0;CATEGORIES.push(...cat.categories);changed=true;}
    if(Array.isArray(cat.vendors)&&cat.vendors.length){VENDORS.length=0;VENDORS.push(...cat.vendors);VENDORS.forEach(v=>{if(!v.governorate)v.governorate=govOfCity(v.city);});changed=true;}
    if(Array.isArray(cat.tips)&&cat.tips.length){TIPS.length=0;TIPS.push(...cat.tips);changed=true;}
    if(Array.isArray(cat.ads)){ADS.length=0;ADS.push(...cat.ads);changed=true;}
    if(cat.settings&&typeof cat.settings==="object"){SETTINGS=cat.settings;changed=true;}
    if(cat.version){S._catalogVersion=cat.version;}
    if(S.account&&S.account.token && !opts.catalogOnly){
      // refresh profile + entitlement; only sign out on an explicit auth
      // failure (401), never on a transient network/backend error
      try{
        const me=await api("/api/me");
        if(me&&me.user){S.account={...S.account,...me.user,token:S.account.token};changed=true;}
        if(me&&me.subscription){S.subscription={plan:me.subscription.plan,tier:me.subscription.tier||null,since:me.subscription.since||null};changed=true;}
      }catch(e){
        if(/\(401\)|not_signed_in|unauthor/i.test(e.message||"")){S.account=null;changed=true;}
      }
    }
    if(changed){save(); if(!opts.silent) render();}
  }catch(e){/* offline or backend down — local data keeps working */}
  finally{ _applyingRemote=false; }
  if(_seedBaseline && isAdmin() && apiBase()) autoPublish();  // seed empty cloud catalog once
  // pull anything the admin sent while the app was closed, quietly
  if(!window.ZAFFA_ADMIN) fetchBroadcasts({announce:false});
}

/* Publish the current catalog to the backend. Called automatically (debounced)
   whenever an admin makes a change, so edits go live for customers with no
   manual "publish" step. */
/* Compress any oversized embedded (data-URI) images in place before publishing,
   so the catalog payload stays well under the serverless request-size limit. */
async function slimCatalogImages(){
  if(typeof compressImage!=="function")return;
  // Cover is shown as a full-width hero → keep it at 1024px for sharpness, only
  // re-compressing genuinely huge uploads. Gallery thumbs stay small.
  const bigCover=(s)=>typeof s==="string" && s.startsWith("data:image") && s.length>360000;
  const bigThumb=(s)=>typeof s==="string" && s.startsWith("data:image") && s.length>90000;
  for(const v of VENDORS){
    if(bigCover(v.cover)){ const c=await compressImage(v.cover,1024,0.82); if(c)v.cover=c; }
    if(Array.isArray(v.gallery)){
      for(let i=0;i<v.gallery.length;i++){ if(bigThumb(v.gallery[i])){ const c=await compressImage(v.gallery[i],512,0.8); if(c)v.gallery[i]=c; } }
    }
  }
}
async function publishCatalog(){
  await slimCatalogImages();
  const r=await api("/api/admin/catalog",{method:"PUT",body:{categories:CATEGORIES,vendors:VENDORS,tips:TIPS,ads:ADS}});
  if(r&&r.version){S._catalogVersion=r.version; save();}
  return r;
}
/* Compress oversized logos in a vendor list (used by the incremental save). */
async function slimVendorList(list){
  if(typeof compressImage!=="function")return list;
  const bigCover=(s)=>typeof s==="string"&&s.startsWith("data:image")&&s.length>360000;
  for(const v of list){ if(bigCover(v.cover)){ const c=await compressImage(v.cover,1024,0.82); if(c)v.cover=c; } }
  return list;
}
/* Robust save: send only the changed vendor(s). Tiny request, server merges it
   into the published catalog. This is the primary admin save path. */
async function saveVendorsRemote(list){
  await slimVendorList(list);
  const r=await api("/api/admin/vendors",{method:"POST",body:{vendors:list,categories:CATEGORIES}});
  if(r&&r.version){S._catalogVersion=r.version; save();}
  return r;
}
async function deleteVendorRemote(id){
  const r=await api("/api/admin/vendors/delete",{method:"POST",body:{id}});
  if(r&&r.version){S._catalogVersion=r.version; save();}
  return r;
}
/* Publish app branding/settings (e.g. the splash image) so it goes live for
   customers instantly — same real-time path as vendor edits. */
async function saveSettingsRemote(settings){
  const r=await api("/api/admin/settings",{method:"POST",body:{settings}});
  if(r&&r.version){S._catalogVersion=r.version; save();}
  return r;
}
let _pubTimer=null, _pubPending=false, _pubRetries=0, _lastPubError="";
function schedulePublish(delay){
  _pubPending=true;
  clearTimeout(_pubTimer);
  _pubTimer=setTimeout(runPublish,delay);
  syncDot("pending");
}
async function runPublish(){
  _pubPending=false;
  try{ await publishCatalog(); _pubRetries=0; _lastPubError=""; syncDot("ok"); }
  catch(e){
    _lastPubError=(e&&e.message)||"error";
    if(e&&(e.status===401||e.status===403)){ handleAdminAuthLost(); return; } // token invalid
    if(_pubRetries<4){ _pubRetries++; syncDot("err",_lastPubError); schedulePublish(1500*_pubRetries); } // retry
    else syncDot("err",_lastPubError);
  }
}
function lastPublishError(){ return _lastPubError; }
function autoPublish(){
  if(_applyingRemote || !(isAdmin() && apiBase()))return;
  schedulePublish(900); // debounce rapid edits into one publish
}
/* The stored admin token is no longer valid on the server (expired, or the
   auth secret rotated after a DB reset). Drop the local admin session and
   send them back to the sign-in gate so their next publish actually lands. */
function handleAdminAuthLost(){
  _pubRetries=0;
  try{ S.account=null; S.role="bride"; save(); }catch(e){}
  toast("Your admin session expired — please sign in again to publish","🔒");
  if(typeof go==="function") go("/admin");
  if(typeof render==="function") render();
}
/* tiny live "saving…/saved" indicator for the admin */
function syncDot(state,detail){
  let el=document.getElementById("sync-dot");
  if(!el){el=h("div#sync-dot",{style:{position:"fixed",top:"10px",left:"50%",transform:"translateX(-50%)",zIndex:"120",
    padding:"5px 12px",borderRadius:"999px",fontSize:"12px",fontWeight:"600",boxShadow:"var(--shadow-2)",transition:"opacity .3s",pointerEvents:"none"}});
    document.body.appendChild(el);}
  const map={pending:["Saving…","var(--surface)","var(--ink2)"],ok:["✓ Saved & live","var(--good-soft)","var(--good)"],err:["⚠ Not live yet — retrying…","var(--warn-soft)","var(--warn)"]};
  let [txt,bg,col]=map[state]||map.ok;
  if(state==="err" && detail) txt="⚠ "+detail;   // show the real reason
  el.textContent=txt; el.style.background=bg; el.style.color=col; el.style.opacity="1";
  clearTimeout(el._t);
  // only the success chip auto-hides; "pending" and "err" stay visible so the
  // admin always knows whether their changes actually reached customers.
  if(state==="ok"){ el._t=setTimeout(()=>{el.style.opacity="0";},1800); }
}

/* ---- Real-time polling: pull admin changes into open customer apps ---- */
let _pollTimer=null;
/* ---- admin broadcasts ----
   The admin's "Send notification" used to call pushNotif(), which only writes
   to the admin's OWN device — no bride ever saw it. Notifications now go to the
   server; every app pulls anything newer than the last one it has seen and
   files it in the bell. `since` means a caught-up client gets an empty list. */
async function fetchBroadcasts({announce=true}={}){
  if(!apiBase())return 0;
  try{
    const since=S._lastBroadcastAt||0;
    const r=await api("/api/broadcasts?since="+encodeURIComponent(since));
    const list=(r&&r.broadcasts)||[];
    if(!list.length){
      // still advance the cursor so a quiet poll stays a cheap no-op
      if(r&&r.now&&!since)S._lastBroadcastAt=r.now, save();
      return 0;
    }
    const seen=new Set(S.notifs.map(n=>n.id));
    let added=0, newest=since;
    // oldest first, so the bell ends up newest-at-top like everything else
    list.slice().sort((a,b)=>a.sentAt-b.sentAt).forEach(b=>{
      if(b.sentAt>newest)newest=b.sentAt;
      if(seen.has(b.id))return;                       // already delivered
      pushNotif({id:b.id,em:b.em,title:b.title,body:b.body,when:b.sentAt,fromAdmin:true});
      added++;
    });
    S._lastBroadcastAt=newest; save();
    if(added){
      // toast only for ones that land while she is using the app; at launch the
      // bell badge is enough (a stack of toasts on open would just be noise)
      if(announce)toast(list[0].title,list[0].em||"🔔");
      if(typeof render==="function")render();          // refresh the bell badge
    }
    return added;
  }catch(e){ return 0; }                               // offline → try again next poll
}

function startCatalogPolling(){
  if(!apiBase()||_pollTimer)return;
  const tick=async()=>{
    // don't disturb an admin mid-edit or anyone with a sheet/modal open
    if(_pubPending || document.querySelector(".scrim")) return;
    try{
      const meta=await api("/api/catalog/meta");
      if(meta && meta.version && meta.version!==S._catalogVersion){
        await cloudInit({catalogOnly:true}); // pull latest, re-render
      }
      if(!window.ZAFFA_ADMIN) await fetchBroadcasts();   // new notifications from the admin
    }catch(e){/* backend asleep/offline — try again next tick */}
  };
  _pollTimer=setInterval(tick,5000);               // every 5s → near-instant catalog updates
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) tick(); });
  window.addEventListener("focus",tick);
}

/* Detect the native iOS wrapper + a StoreKit purchase bridge, if present. */
function nativeIAP(){
  const cap = window.Capacitor;
  if(!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return null;
  // Support either a custom bridge (window.ZaffaIAP) or a Capacitor IAP plugin.
  if(window.ZaffaIAP && window.ZaffaIAP.purchase) return window.ZaffaIAP;
  const plugin = cap.Plugins && (cap.Plugins.InAppPurchase || cap.Plugins.Purchases || cap.Plugins.CdvPurchase);
  return plugin || null;
}

function paymentProvider(){
  if(nativeIAP()) return "apple";
  if(apiBase()) return "smartpay";
  return "demo";
}
function providerLabel(){
  return {apple:"Apple", smartpay:"Bank Muscat SmartPay", demo:"Demo"}[paymentProvider()];
}

/* Main entry: returns a promise that resolves when Premium is granted. */
async function payCheckout(planId){
  const provider = paymentProvider();
  try{
    if(provider === "apple")    return await checkoutApple(planId);
    if(provider === "smartpay") return await checkoutSmartPay(planId);
    return await checkoutDemo(planId);
  }catch(e){
    toast(e && e.message ? e.message : "Payment could not be completed","⚠️");
    throw e;
  }
}

/* ---- Demo: no real charge, unlock immediately (labelled in the paywall) ---- */
function checkoutDemo(planId){
  return new Promise(resolve=>{
    goPremium(planId);
    resolve({ok:true,provider:"demo",plan:planId});
  });
}

/* ---- Apple In-App Purchase (StoreKit via the native bridge) ---- */
async function checkoutApple(planId){
  const iap = nativeIAP();
  const productId = PAY_CONFIG.appleProducts[planId];
  const result = await iap.purchase({ productId });      // native bridge resolves on success
  // Verify the receipt/transaction server-side before granting entitlement.
  const proof = result.jws ? {jws:result.jws} : {receipt:result.receipt};
  if(apiBase()){
    const v = await api("/api/payments/apple/verify",{method:"POST",body:{...proof,userId:currentUserId(),planId}});
    if(!v.ok) throw new Error(v.reason||"Receipt could not be verified");
  }
  goPremium(planId);
  return {ok:true,provider:"apple",plan:planId};
}

/* ---- Bank Muscat SmartPay (server creates session → we redirect) ---- */
async function checkoutSmartPay(planId){
  // paying is nicer with an account: Premium then follows the user anywhere
  if(!S.account)await new Promise(res=>openAccountSheet(res));
  if(!S.account)throw new Error("Sign in to continue");
  const session = await api("/api/payments/smartpay/session",{method:"POST",
    body:{planId,userId:currentUserId(),name:S.bride.name}});
  if(!session || !session.action) throw new Error("Could not start payment");
  // remember intent so /premium/return can confirm after the redirect bounce
  try{ localStorage.setItem("zaffa.pendingPlan", planId); }catch{}
  // auto-submit the encrypted redirect form to the Bank-hosted page
  const form=document.createElement("form");
  form.method="POST"; form.action=session.action; form.style.display="none";
  Object.entries(session.fields).forEach(([k,v])=>{
    const i=document.createElement("input"); i.type="hidden"; i.name=k; i.value=v; form.appendChild(i);
  });
  document.body.appendChild(form); form.submit();
  return new Promise(()=>{}); // navigation leaves the page
}

function currentUserId(){
  if(S.account&&(S.account.id||S.account.phone||S.account.email))return S.account.id||S.account.phone||S.account.email;
  return (S.bride && S.bride.name ? S.bride.name : "anon")+"|"+(S.bride.date||"");
}

      h("div",{style:{fontSize:"54px",marginBottom:"8px"}},"🎉"),

      h("h2",{style:{fontSize:"27px",margin:"6px 0 4px"}},"You're all set"+name+" 💗"),

        "Welcome to Premium! Everything is unlocked — unlimited vendor categories, unlimited chats with Aya, calendar sync and smart reminders. Let's plan your dream wedding."),
      h("button.btn.btn-pri.btn-lg",{onclick:()=>go("/home")},"Start planning"),
    ]));
    setTimeout(confetti,150);
  }
  /* A failed or cancelled payment shouldn't strand her on a status screen:
     take her back to her profile and explain what happened in a popup. */
  function failed(msg){
    go("/profile");
    setTimeout(()=>paymentFailedPopup(msg),260);
  }

  (async()=>{
    await new Promise(r=>setTimeout(r,0));   // let this screen mount before we redirect
    // The gateway already told us it didn't go through — don't make her wait.
    if(q.status!=="success"){ failed(); return; }
    // Otherwise trust the server, not the URL: poll /api/me briefly in case the
    // callback is still landing, and reflect whatever the server actually granted.
    let confirmed=false;
    if(S.account && S.account.token && apiBase()){
      for(let i=0;i<5 && !confirmed;i++){
        try{
          const me=await api("/api/me");
          if(me&&me.subscription){ S.subscription={plan:me.subscription.plan,tier:me.subscription.tier||null,since:me.subscription.since||null}; save(); }
        }catch(e){}
        confirmed=isPremium();
        if(!confirmed) await new Promise(r=>setTimeout(r,1400));
      }
    }
    if(confirmed) success();
    else failed("We couldn't confirm the payment. If you were charged, Premium will unlock automatically within a few minutes.");
  })();

  return appFrame([h("div",{style:{height:"14px"}}),box],{noTab:true});
});

/* ---- Bulk vendor import (Excel .xlsx / .xls or CSV) ---- */
const CSV_COLUMNS=["name","category","governorate","city","tier","short","instagram","whatsapp","phone","logo"];
function parseCSV(text){
  const rows=[]; let i=0,field="",row=[],inQ=false;
  const pushF=()=>{row.push(field);field="";};
  const pushR=()=>{pushF();rows.push(row);row=[];};
  while(i<text.length){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
    else{ if(c==='"')inQ=true; else if(c===',')pushF(); else if(c==='\n')pushR(); else if(c==='\r'){} else field+=c; }
    i++;
  }
  if(field.length||row.length)pushR();
  return rows.filter(r=>r.some(x=>x&&String(x).trim()));
}
/* rows = array-of-arrays (row 0 = header). Shared by CSV + Excel. */
function rowsToVendors(rows){
  if(!rows||!rows.length)return {vendors:[],errors:["Empty file"]};
  const header=rows[0].map(h=>String(h||"").trim().toLowerCase());
  const idx=(...names)=>{ for(const n of names){const j=header.indexOf(n); if(j>=0)return j;} return -1; };
  const cols={name:idx("name"),category:idx("category","cat"),gov:idx("governorate","gov"),city:idx("city","area"),
    tier:idx("tier","pricelevel","price","level"),short:idx("short","description","desc"),
    ig:idx("instagram","ig"),wa:idx("whatsapp","wa"),phone:idx("phone","tel","mobile"),logo:idx("logo","cover","image")};
  const out=[],errors=[];
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; const get=(j)=>j>=0?String(row[j]==null?"":row[j]).trim():"";
    const name=get(cols.name); if(!name)continue;
    const catRaw=get(cols.category).toLowerCase();
    const cat=CATEGORIES.find(c=>c.id.toLowerCase()===catRaw||c.name.toLowerCase()===catRaw)||CATEGORIES[0];
    const gov=GOVERNORATES.find(g=>g.toLowerCase()===get(cols.gov).toLowerCase())||GOVERNORATES[0];
    const city=get(cols.city)||gov;
    const tierRaw=get(cols.tier).toLowerCase();
    const tierMap={budget:1,standard:2,premium:3,luxury:4};
    const pl=Math.min(4,Math.max(1,parseInt(tierRaw,10)||tierMap[tierRaw]||2));
    out.push({id:"v"+String(Date.now()).slice(-6)+r, catId:cat.id, name, governorate:gov, city,
      priceLevel:pl, short:get(cols.short)||"",
      instagram:get(cols.ig), whatsapp:get(cols.wa)||"+968 ", phone:get(cols.phone)||"+968 ",
      cover:get(cols.logo), maps:city+", Oman",
      featured:false, approved:true, isNew:true, offer:null});
  }
  return {vendors:out,errors};
}
function csvToVendors(text){ return rowsToVendors(parseCSV(text)); }
/* lazily load the self-hosted SheetJS parser (admin-only, CSP-safe) */
function loadXLSX(){
  return new Promise((res,rej)=>{
    if(window.XLSX)return res(window.XLSX);
    const s=document.createElement("script"); s.src="assets/xlsx.min.js";
    s.onload=()=>window.XLSX?res(window.XLSX):rej(new Error("parser failed to load"));
    s.onerror=()=>rej(new Error("Could not load the Excel parser"));
    document.head.appendChild(s);
  });
}
async function excelToVendors(arrayBuffer){
  const XLSX=await loadXLSX();
  const wb=XLSX.read(arrayBuffer,{type:"array"});
  const sheet=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sheet,{header:1,blankrows:false,defval:""});
  return rowsToVendors(rows);
}
function openBulkImport(onDone){
  let parsed=null;
  let ref;
  const template="name,category,governorate,city,tier,short,instagram,whatsapp,phone,logo\n"+
    "Rose Atelier,dresses,Muscat,Muscat,luxury,Elegant couture gowns,@rose_atelier,+96890000000,+96824000000,https://example.com/logo.jpg";
  ref=sheet({title:"Bulk import vendors",body:(close)=>{
    const b=h("div.col.gap12",{style:{marginTop:"4px"}});
    b.appendChild(h("p.small.muted","Upload an Excel file (.xlsx) or CSV. Columns: "+CSV_COLUMNS.join(", ")+". Category can be an id or name; tier can be budget / standard / premium / luxury."));
    b.appendChild(h("button.btn.btn-sec.btn-sm",{onclick:()=>{
      const blob=new Blob([template],{type:"text/csv"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="vendors-template.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
    }},[icon("share",15),"Download template"]));
    const count=h("p.small.muted");
    const setCount=()=>{count.textContent=parsed?(parsed.vendors.length+" vendors ready to import"):"";};
    const file=h("input",{type:"file",accept:".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",style:{display:"none"},onchange:async e=>{
      const f=e.target.files[0];if(!f)return; count.textContent="Reading "+f.name+"…";
      try{
        if(/\.(xlsx|xls)$/i.test(f.name)){
          const buf=await f.arrayBuffer(); parsed=await excelToVendors(buf);
        }else{
          const txt=await f.text(); ta.value=txt; parsed=csvToVendors(txt);
        }
        setCount();
      }catch(err){ count.textContent=""; toast("Couldn't read file: "+((err&&err.message)||"error"),"⚠️"); }
    }});
    b.appendChild(h("button.btn.btn-sec.btn-block",{onclick:()=>file.click()},[icon("share",16),"Choose Excel or CSV file"]));
    b.appendChild(file);
    const ta=h("textarea.field",{placeholder:"…or paste CSV here",style:{minHeight:"110px",fontFamily:"var(--font-m)",fontSize:"12px"},oninput:e=>{parsed=e.target.value.trim()?csvToVendors(e.target.value):null;setCount();}});
    b.appendChild(ta);
    b.appendChild(count);
    return b;
  },actions:[
    h("button.btn.btn-sec.grow",{onclick:()=>ref.close()},"Cancel"),
    h("button.btn.btn-pri.grow",{onclick:async(e)=>{
      if(!parsed||!parsed.vendors.length){toast("Nothing to import","⚠️");return;}
      const list=parsed.vendors;
      VENDORS.unshift(...list); save();
      const done=busy(e.currentTarget,"Importing…");
      if(typeof isAdmin==="function"&&isAdmin()&&typeof saveVendorsRemote==="function"&&apiBase()){
        try{ await saveVendorsRemote(list); ref.close(); toast(list.length+" vendors imported & live ✓","🎉"); onDone&&onDone(); }
        catch(err){ done(); toast("Import failed to publish: "+((err&&err.message)||"error"),"⚠️"); }
      }else{ ref.close(); toast(list.length+" vendors imported ✓","🎉"); onDone&&onDone(); }
    }},"Import vendors"),
  ]});
}

  const midI=h("input.field",{placeholder:"e.g. 249",oninput:e=>d.merchantId=e.target.value});
  const acI=h("input.field",{placeholder:"Access code",oninput:e=>d.accessCode=e.target.value});
  const wkI=h("input.field",{type:"password",placeholder:"Leave blank to keep current",oninput:e=>d.workingKey=e.target.value});
  const urlI=h("input.field",{placeholder:"Transaction URL",oninput:e=>d.txnUrl=e.target.value});
  const curI=h("input.field",{value:"OMR",oninput:e=>d.currency=e.target.value});
  form.append(
    h("div",[h("label.lbl","Merchant ID (MID)"),midI]),
    h("div",[h("label.lbl","Access code"),acI]),
    h("div",[h("label.lbl","Working key"),wkI]),
    h("div",[h("label.lbl","Transaction URL"),urlI]),
    h("div",[h("label.lbl","Currency"),curI]),
  );
  const saveBtn=h("button.btn.btn-pri.btn-lg.btn-block",{style:{marginTop:"14px"},onclick:async()=>{
    if(!d.merchantId.trim()||!d.accessCode.trim()){toast("Enter MID and access code","⚠️");return;}
    const done=busy(saveBtn,"Saving…");
    try{
      const r=await api("/api/admin/config/smartpay",{method:"PUT",body:d});
      toast("Bank Muscat settings saved ✓","🏦"); paint(r);
      d.workingKey=""; wkI.value="";
    }catch(e){toast(e.message,"⚠️");}
    done();
  }},"Save settings");
  kids.push(form);
  kids.push(saveBtn);
  kids.push(h("p.tiny.faint",{style:{margin:"14px 3px"}},
    "The working key is stored securely on the server and never shown in full."));

  function paint(cfg){
    clear(status);
    const ok=cfg.configured;
    status.appendChild(h("div.row.gap10",{style:{alignItems:"center"}},[
      h("span.icon-btn",{style:{width:"38px",height:"38px",background:ok?"var(--good-soft)":"var(--warn-soft)",color:ok?"var(--good)":"var(--warn)",border:"0"}},icon(ok?"check":"info",18)),
      h("div.grow",[h("b.small",ok?"Connected to Bank Muscat":"Not fully configured"),
        h("div.tiny.faint",cfg.merchantId?("MID "+cfg.merchantId+(cfg.workingKeySet?" · key "+cfg.workingKeyMasked:"")):"No credentials yet")]),
    ]));
    midI.value=cfg.merchantId||""; d.merchantId=cfg.merchantId||"";
    acI.value=cfg.accessCode||""; d.accessCode=cfg.accessCode||"";
    urlI.value=cfg.txnUrl||""; d.txnUrl=cfg.txnUrl||"";
    curI.value=cfg.currency||"OMR"; d.currency=cfg.currency||"OMR";
    wkI.placeholder=cfg.workingKeySet?"•••• set — blank keeps it":"Enter working key";
  }
  api("/api/admin/config/smartpay").then(paint).catch(e=>{clear(status);status.appendChild(h("div.small.muted","Couldn't load settings: "+e.message));});
  return appFrame(kids,{tabs:adminTabs("/admin/more")});
});

function openBroadcastForm(user,onSent){
  const d={em:"💌",title:"",body:""};
  const emojis=["💌","🔔","🎁","💄","📸","🎂","🏛️","✨","💗"];
  let ref;
  ref=sheet({title:user?("Notify "+user.name):"Send notification",body:(close)=>{
    const emRow=h("div.row.wrap.gap8");
    emojis.forEach(em=>{const b=h("button.chip"+(em===d.em?".on":""),{onclick:()=>{d.em=em;[...emRow.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");}},em);emRow.appendChild(b);});
    return h("div.col.gap12",[
      h("div",[h("label.lbl","Icon"),emRow]),
      h("div",[h("label.lbl","Title"),h("input.field",{placeholder:"Notification title",oninput:e=>d.title=e.target.value})]),
      h("div",[h("label.lbl","Message"),h("textarea.field",{placeholder:"Message to brides…",oninput:e=>d.body=e.target.value})]),
    ]);
  },actions:[
    h("button.btn.btn-sec.grow",{onclick:()=>ref.close()},"Cancel"),
    (()=>{
      const send=h("button.btn.btn-pri.grow",{onclick:async()=>{
        if(!d.title.trim()){toast("Enter a title","⚠️");return;}
        if(!apiBase()){toast("Connect the backend to send notifications","⚠️");return;}
        // This used to call pushNotif(), which writes to the ADMIN's own device
        // only — no bride ever received it. It now goes to the server, and every
        // app picks it up on its next poll.
        const done=busy(send,"Sending…");
        try{
          await api("/api/admin/broadcasts",{method:"POST",
            body:{em:d.em,title:d.title,body:d.body,audience:user?user.id:"all"}});
          ref.close();
          toast(user?("Sent to "+user.name+" 📨"):"Sent to all brides 📨");
          onSent&&onSent();
        }catch(e){ toast(e.message||"Could not send","⚠️"); done(); }
      }},[icon("send",16),"Send"]);
      return send;
    })(),
  ]});
}

/* ---------- ADS ---------- */
route("/admin/ads",()=>{
  const kids=[adminTop("Advertisements",h("button.icon-btn",{onclick:()=>openAdForm()},icon("plus",22)))];
  const list=h("div.col.gap12"); kids.push(list);
  function draw(){clear(list);
    if(!ADS.length)list.appendChild(h("div.empty",[h("div.em","📢"),h("h3","No ads"),h("p.muted","Create a promoted banner for the home screen.")]));
    ADS.forEach(a=>{const av=vendorById(a.vendorId);
      list.appendChild(h("div.card.pad-s",[
        h("div.between",[h("div.row.gap8",[h("span.tag "+(a.active?"tag-gold":"tag-todo"),a.active?"Active":"Paused"),h("b",a.title)]),
          h("button.icon-btn.plain",{onclick:()=>{
            let ref;ref=sheet({title:a.title,body:(close)=>h("div.col.gap8",[
              h("button.lrow",{style:{width:"100%",cursor:"pointer"},onclick:()=>{a.active=!a.active;save();ref.close();toast(a.active?"Ad activated":"Ad paused");draw();}},[icon("check",18,"faint"),h("span.grow",{style:{fontWeight:600}},a.active?"Pause ad":"Activate ad")]),
              h("button.lrow",{style:{width:"100%",cursor:"pointer"},onclick:()=>{ref.close();openAdForm(a,draw);}},[icon("edit",18,"faint"),h("span.grow",{style:{fontWeight:600}},"Edit ad")]),
              h("button.lrow",{style:{width:"100%",cursor:"pointer",color:"var(--crit)"},onclick:()=>{const i=ADS.indexOf(a);ADS.splice(i,1);save();ref.close();toast("Ad deleted");draw();}},[icon("trash",18),h("span.grow",{style:{fontWeight:600}},"Delete ad")]),
            ])});
          }},icon("sliders",20))]),
        h("p.small.muted",{style:{marginTop:"6px"}},a.body),
        av?h("div.tiny.faint",{style:{marginTop:"4px"}},["Links to: ",av.name]):null,
      ]));
    });
  }
  draw();
  return appFrame(kids,{tabs:adminTabs("/admin/more")});
});
function openAdForm(a,rerender){
  const isNew=!a; const d=a?{...a}:{title:"",body:"",vendorId:VENDORS[0].id,active:true,placement:"home"};
  let ref;
  ref=sheet({title:isNew?"New ad":"Edit ad",body:(close)=>{
    const vSel=h("select.field",VENDORS.map(v=>h("option",{value:v.id,selected:v.id===d.vendorId},v.name)));
    vSel.onchange=e=>d.vendorId=e.target.value;
    return h("div.col.gap12",[
      h("div",[h("label.lbl","Title"),h("input.field",{value:d.title,oninput:e=>d.title=e.target.value})]),
      h("div",[h("label.lbl","Body"),h("input.field",{value:d.body,oninput:e=>d.body=e.target.value})]),
      h("div",[h("label.lbl","Links to vendor"),vSel]),
    ]);
  },actions:[
    h("button.btn.btn-sec.grow",{onclick:()=>ref.close()},"Cancel"),
    h("button.btn.btn-pri.grow",{onclick:()=>{if(!d.title.trim()){toast("Enter a title","⚠️");return;}
      if(isNew){d.id="ad"+Date.now().toString(36);ADS.push(d);toast("Ad created ✓");}else{Object.assign(a,d);toast("Ad updated ✓");}
      save();ref.close();rerender?rerender():render();}},isNew?"Create":"Save"),
  ]});
}

function openTipForm(t,rerender){

<script>
/* ============ ZAFFA — BOOT ============ */
load();

/* The admin panel is web-only: it must never run inside the native iOS/Android
   app (the store build ships the bride app alone). The native bundle also has
   admin.html stripped at sync time — this is the belt-and-braces guard. */
if(window.ZAFFA_ADMIN && isNativeApp()){
  document.body.innerHTML='<div style="font-family:-apple-system,system-ui,sans-serif;display:grid;'+
    'place-items:center;min-height:100vh;padding:32px;text-align:center;color:#2B2B2F;background:#F4F3F1">'+
    '<div><div style="font-size:44px">🔒</div><h2 style="margin:12px 0 6px">Admin is web-only</h2>'+
    '<p style="color:#7A6A6E;max-width:300px;margin:0 auto">Manage vendors from a browser at '+
    'weddingandco.vercel.app/admin.html</p></div></div>';
  throw new Error("admin_web_only");
}

showSplash();             // admin-configurable launch splash (bride app only; no-op if none set)
if(window.ZAFFA_ADMIN){
  // dedicated admin page (admin.html) — always lands on the access-controlled panel
  document.body.classList.add("admin");   // enables the wider desktop layout (see CSS)
  if(!location.hash || location.hash==="#/" || location.hash==="#/welcome") location.hash = "#/admin";
}else if(!location.hash){
  location.hash = S.onboarded ? (S.role==="admin"?"#/admin":"#/home") : "#/welcome";
}
toastRegion();            // live region must exist before the first announcement
render();
cloudInit();            // pulls the live catalog + account entitlement when a backend is configured
startCatalogPolling();    // keeps open apps in sync with admin changes in near real-time

// keep theme in sync with system when in auto mode
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme:dark)").addEventListener?.("change",()=>{if(S.theme==="auto")applyTheme();});
}

</script>
